name: TANTRE quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tantre_test_only
          POSTGRES_DB: tantre_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run check
      - run: npm run db:verify
      - run: node scripts/db-concurrency.mjs
        env:
          TEST_DATABASE_URL: postgres://postgres:tantre_test_only@localhost:5432/tantre_ci
      - run: npm run build
      - run: npm run deploy:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify Cloudflare runtime
        run: |
          npx wrangler dev --port 8791 > /tmp/tantre-worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8791/api/health; then
              curl --fail http://localhost:8791/api/qr?type=ceramic
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tantre-worker.log
          exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
